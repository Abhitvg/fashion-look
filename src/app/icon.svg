<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="192" height="192" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d792"/>
      <stop offset="45%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8a6a14"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="200" height="200" rx="34" fill="url(#bg)"/>

  <!-- inner gold ring -->
  <rect x="12" y="12" width="176" height="176" rx="26" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.85"/>

  <!-- monogram -->
  <text x="100" y="127" font-family="Liberation Serif, Georgia, 'Times New Roman', serif" font-size="98" font-style="italic" font-weight="600" text-anchor="middle" fill="url(#gold)" letter-spacing="-2">FL</text>

  <!-- underline flourish -->
  <line x1="58" y1="144" x2="142" y2="144" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
